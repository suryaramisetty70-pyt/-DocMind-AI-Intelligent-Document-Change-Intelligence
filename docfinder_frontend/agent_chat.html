<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Chat · ScholarSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 4rem);
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03), 0 8px 24px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }
        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .chat-header h2 { margin: 0; font-size: 1.2rem; color: #0f172a; }
        .chat-header p { margin: 0; font-size: 0.85rem; color: var(--muted); }
        .chat-header-icon { font-size: 2rem; }
        
        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: #fafafa;
        }
        .msg {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .msg.user {
            background: #3b82f6;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            background: #fff;
            color: #0f172a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
        }
        
        .chat-input-area {
            padding: 1.5rem;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            height: 60px;
            max-height: 200px;
            transition: all 0.2s;
        }
        .chat-input-area textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .chat-input-area button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 1.5rem;
            height: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-input-area button:hover {
            background: #2563eb;
        }
        
        /* Back to Hub */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .back-btn:hover { color: #0f172a; }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">S</div>
                ScholarSync
            </div>
            
            <div class="s-section">Workspace</div>
            <a href="dashboard.html" class="s-link active">⚡ The Hub</a>
            <a href="history.html" class="s-link">🕓 History</a>
            
            <div class="s-section">Resources</div>
            <a href="#" class="s-link">💳 Pricing Plans</a>
            <a href="#" class="s-link">⚖️ Legal & Compliance</a>
            
            <div class="s-section">Account</div>
            <a href="settings.html" class="s-link">⚙️ Settings</a>
        </aside>
        
        <main class="main" style="padding: 2rem;">
            <a href="dashboard.html" class="back-btn">← Back to Hub</a>
            
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-header-icon" id="agentIcon">🤖</div>
                    <div>
                        <h2 id="agentName">ScholarSync Agent</h2>
                        <p id="agentDesc">AI powered expert assistant</p>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatBox">
                    <div class="msg ai" id="welcomeMsg">Hello! I am loading...</div>
                </div>
                
                <div class="chat-input-area">
                    <textarea id="messageInput" placeholder="Type your message here..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const agentType = urlParams.get('agent') || 'teaching';
        
        const agentInfo = {
            'teaching': { icon: '📚', name: 'Teaching Agent', desc: 'Personalized AI tutor for learning.' },
            'career': { icon: '💼', name: 'Career Agent', desc: 'Career guidance and interview prep.' },
            'medical': { icon: '🏥', name: 'Medical Agent', desc: 'Educational medical information.' },
            'plant': { icon: '🌱', name: 'Plant Intelligence', desc: 'Plant health and disease detection.' },
            'trading': { icon: '📈', name: 'Trading Agent', desc: 'Financial education and markets.' },
            'law': { icon: '⚖️', name: 'Law & Police', desc: 'Legal and procedures knowledge.' }
        };
        
        const info = agentInfo[agentType] || agentInfo['teaching'];
        document.getElementById('agentIcon').textContent = info.icon;
        document.getElementById('agentName').textContent = info.name;
        document.getElementById('agentDesc').textContent = info.desc;
        document.getElementById('welcomeMsg').innerHTML = `Hello! I am your <b>${info.name}</b>. How can I assist you today?`;
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            // Add user message to UI
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Add loading AI msg
            const tempId = 'msg-' + Date.now();
            chatBox.innerHTML += `<div class="msg ai" id="${tempId}">...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('https://vennilaai.in/api/agents/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ agent_type: agentType, message: text })
                });
                
                const data = await response.json();
                if (response.ok) {
                    document.getElementById(tempId).innerHTML = data.reply.replace(/\n/g, '<br>');
                } else {
                    document.getElementById(tempId).textContent = "Error: " + (data.detail || "Unable to reach agent.");
                }
            } catch (e) {
                document.getElementById(tempId).textContent = "Network error. Please try again.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
